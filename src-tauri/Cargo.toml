[package]
name = "vectorcut"
version = "1.1.0"
description = "Universal Single-Line (Centerline) & Outline SVG Converter"
authors = ["VectorCut Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
rfd = "0.15"
tract-onnx = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
dirs-next = "2.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
